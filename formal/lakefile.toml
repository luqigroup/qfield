name = "QuadratureField"
defaultTargets = ["QuadratureField"]

# Machine-checked Lean 4 + mathlib formalization of the theoretical claims of
# "Amortized quadrature for posterior expectations in inverse problems"
# (paper/main_v9.tex). Mathlib is pinned to the release whose toolchain matches
# `lean-toolchain` (leanprover/lean4:v4.31.0), so `lake exe cache get` fetches
# PREBUILT oleans and nothing compiles mathlib from source. Same pin as
# ~/Codes/resolvability/formal, whose lake-manifest.json is copied verbatim.

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "QuadratureField"
